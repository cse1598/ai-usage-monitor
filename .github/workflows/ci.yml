name: Compatibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Collector tests (mock CLI responses)
        run: python -m unittest discover -s tests -p test_collector.py -v
      - name: Environment checks (mock GNOME and CLIs)
        run: python -m unittest discover -s tests -p test_environment.py -v
      - name: Shell syntax
        run: |
          for script in install.sh uninstall.sh check_environment.sh; do
            bash -n "$script" || exit 1
          done
      - name: JavaScript module syntax
        run: |
          node --input-type=module --check < extension/extension.js
          node --input-type=module --check < extension/i18n.js
          node --input-type=module --check < extension/preferences.js
      - name: Localization tests
        run: node --test tests/test_i18n.mjs tests/test_preferences.mjs
      - name: Extension metadata
        run: python -m json.tool extension/metadata.json > /dev/null
